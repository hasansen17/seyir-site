# Siteyi yayınla (24 Kasım): Jekyll (gizlilik, koşullar) + web uygulaması (depoda) + her dizi için paylaşım sayfası ve
# sitemap (yayın sırasında üretilir, depoya yazılmaz). Her push'ta ve her gece (yeni diziler için).
# GitHub Pages kaynağı "GitHub Actions" olmalı (Settings → Pages → Source).
name: Siteyi yayınla
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # GitHub'ın önerdiği gibi iki aşama: hazırla (yükle) → yayınla (yükleme görünür olunca)
  hazirla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Dizi sayfaları ve sitemap
        run: |
          sudo chown -R "$USER" _site
          # Apple Universal Links dosyası (Jekyll eylemi nokta klasörünü atlıyor): elle kopyalanır
          mkdir -p _site/.well-known && cp .well-known/apple-app-site-association _site/.well-known/
          node .github/betikler/dizi_sayfalari.mjs _site
      # upload-pages-artifact nokta ile başlayan klasörleri atıyor; .well-known (Apple) için paket elle hazırlanır
      - name: Paketle
        run: tar --dereference --hard-dereference --directory _site -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github . | grep -c . && tar -tf "$RUNNER_TEMP/artifact.tar" | grep well-known
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  yayinla:
    needs: hazirla
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - id: dagit
        uses: actions/deploy-pages@v4
