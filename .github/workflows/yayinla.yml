# Siteyi yayınla (24 Kasım): Jekyll (gizlilik, koşullar) + web uygulaması (depoda) + her dizi için paylaşım sayfası ve
# sitemap (yayın sırasında üretilir, depoya yazılmaz). Her push'ta ve her gece (yeni diziler için).
# GitHub Pages kaynağı "GitHub Actions" olmalı (Settings → Pages → Source).
name: Siteyi yayınla
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Dizi sayfaları ve sitemap
        run: |
          sudo chown -R "$USER" _site
          # Apple Universal Links dosyası (Jekyll eylemi nokta klasörünü atlıyor): elle kopyalanır, JSON olarak sunulur
          mkdir -p _site/.well-known && cp .well-known/apple-app-site-association _site/.well-known/
          node .github/betikler/dizi_sayfalari.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          include-hidden-files: true
      - id: dagit
        uses: actions/deploy-pages@v4
